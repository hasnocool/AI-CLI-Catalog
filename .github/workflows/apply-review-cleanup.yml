name: Apply review cleanup

on:
  push:
    branches:
      - fix/review-findings-2026-08-14
    paths:
      - .github/workflows/apply-review-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/review-findings-2026-08-14
          fetch-depth: 0

      - name: Apply exact review fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          catalog_path = Path("catalog.json")
          catalog = catalog_path.read_text(encoding="utf-8")

          def patch_entry(text: str, slug: str, replacements: list[tuple[str, str]]) -> str:
              marker = f'"slug": "{slug}"'
              marker_pos = text.find(marker)
              if marker_pos < 0:
                  raise SystemExit(f"missing catalog entry: {slug}")
              start = text.rfind("    {\n", 0, marker_pos)
              end = text.find("\n    },", marker_pos)
              if start < 0 or end < 0:
                  raise SystemExit(f"could not isolate catalog entry: {slug}")
              end += len("\n    },")
              block = text[start:end]
              for old, new in replacements:
                  if block.count(old) != 1:
                      raise SystemExit(
                          f"expected exactly one {old!r} in {slug}, found {block.count(old)}"
                      )
                  block = block.replace(old, new, 1)
              return text[:start] + block + text[end:]

          catalog = patch_entry(
              catalog,
              "fitlab-agent-infra",
              [('"slug": "fitlab-agent-infra"', '"slug": "fitlab-agent-orchestrator"')],
          )
          catalog = patch_entry(
              catalog,
              "agentsmesh-config-cli",
              [('"daemon_server": null', '"daemon_server": true')],
          )
          catalog = patch_entry(
              catalog,
              "prjct-cli",
              [
                  ('"openai_compatible": false', '"openai_compatible": true'),
                  ('"mcp": null', '"mcp": true'),
                  ('"api_key": false', '"api_key": true'),
              ],
          )
          catalog_path.write_text(catalog, encoding="utf-8")

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          old_row = "| FitLab Agent Infra | `agent-orchestrator` | `curl -fsSL https://raw.githubusercontent.com/fitlab-ai/agent-orchestrator/main/install.sh \\| sh` | `ao` | https://github.com/fitlab-ai/agent-infra |"
          new_row = "| FitLab Agent Infra | `agent-infrastructure` | `npm install -g @fitlab-ai/agent-infra` | `ai` | https://github.com/fitlab-ai/agent-infra |"
          if readme.count(old_row) != 1:
              raise SystemExit(
                  f"expected exactly one stale FitLab README row, found {readme.count(old_row)}"
              )
          readme = readme.replace(old_row, new_row, 1)
          readme_path.write_text(readme, encoding="utf-8")
          PY

      - name: Validate catalog
        run: python scripts/validate_catalog.py

      - name: Verify targeted values
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("catalog.json").read_text(encoding="utf-8"))
          entries = {entry["slug"]: entry for entry in data["entries"]}

          fitlab = entries["fitlab-agent-orchestrator"]
          assert fitlab["name"] == "FitLab Agent Infra"
          assert fitlab["installer"] == "npm install -g @fitlab-ai/agent-infra"
          assert fitlab["binary"] == "ai"

          agentsmesh = entries["agentsmesh-config-cli"]
          assert agentsmesh["daemon_server"] is True

          prjct = entries["prjct-cli"]
          assert prjct["openai_compatible"] is True
          assert prjct["mcp"] is True
          assert prjct["api_key"] is True
          PY

      - name: Commit cleanup and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/apply-review-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json README.md .github/workflows/apply-review-cleanup.yml
          git commit -m "fix: address catalog review findings"
          git push origin HEAD:fix/review-findings-2026-08-14
