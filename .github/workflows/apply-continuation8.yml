# .github/workflows/apply-continuation8.yml
name: Apply August 13 catalog refresh

on:
  push:
    branches:
      - agent/refresh-cli-catalog-2026-08-13
    paths:
      - "bootstrap/continuation8/**"
      - ".github/workflows/apply-continuation8.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Merge verified candidates and remove stale legacy CLI
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          from collections import Counter
          from pathlib import Path

          catalog_path = Path('catalog.json')
          readme_path = Path('README.md')
          candidates = json.loads(Path('bootstrap/continuation8/candidates.json').read_text(encoding='utf-8'))
          data = json.loads(catalog_path.read_text(encoding='utf-8'))

          if len(candidates) != 3:
              raise SystemExit(f'Expected 3 candidates, found {len(candidates)}')

          stale_slug = 'ao-agents'
          stale = [entry for entry in data['entries'] if entry['slug'] == stale_slug]
          if len(stale) != 1:
              raise SystemExit(f'Expected exactly one stale {stale_slug} entry, found {len(stale)}')
          data['entries'] = [entry for entry in data['entries'] if entry['slug'] != stale_slug]

          slugs = {entry['slug'] for entry in data['entries']}
          installers = {entry['installer'].strip().lower() for entry in data['entries']}
          urls = {entry['url'].rstrip('/').lower() for entry in data['entries']}
          added = []
          for entry in candidates:
              normalized_installer = entry['installer'].strip().lower()
              normalized_url = entry['url'].rstrip('/').lower()
              if entry['slug'] in slugs:
                  raise SystemExit(f"Duplicate slug: {entry['slug']}")
              if normalized_installer in installers:
                  raise SystemExit(f"Duplicate installer: {entry['installer']}")
              if normalized_url in urls:
                  raise SystemExit(f"Duplicate URL: {entry['url']}")
              data['entries'].append(entry)
              slugs.add(entry['slug'])
              installers.add(normalized_installer)
              urls.add(normalized_url)
              added.append(entry)

          data['last_reviewed'] = '2026-08-13'
          data['entries'].sort(key=lambda entry: (entry['category'].lower(), entry['name'].lower(), entry['slug']))
          catalog_path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          total = len(data['entries'])
          if total != 427:
              raise SystemExit(f'Expected 427 entries after +3/-1, found {total}')

          counts = Counter(entry['category'] for entry in data['entries'])
          readme = readme_path.read_text(encoding='utf-8')
          readme = re.sub(r'> Last reviewed: \d{4}-\d{2}-\d{2}', '> Last reviewed: 2026-08-13', readme, count=1)
          readme = re.sub(r'> Catalog entries: \*\*\d+\*\*', f'> Catalog entries: **{total}**', readme, count=1)
          category_table = ['| Category | Entries |', '|---|---:|'] + [
              f'| `{category}` | {count} |'
              for category, count in sorted(counts.items(), key=lambda item: (-item[1], item[0]))
          ]
          readme = re.sub(
              r'## Categories\n.*?(?=\n## )',
              '## Categories\n\n' + '\n'.join(category_table) + '\n',
              readme,
              count=1,
              flags=re.S,
          )

          marker = '## Newly verified CLIs — August 13, 2026'
          if marker in readme:
              readme = readme.split(marker, 1)[0].rstrip() + '\n\n'

          def esc(value):
              return str(value).replace('|', '\\|').replace('`', '\\`')

          section = [
              marker,
              '',
              'This pass adds **3 newly verified terminal-first AI tools** and removes the frozen legacy `@aoagents/ao` CLI entry after upstream marked npm distribution as legacy and no longer recommended for new installs.',
              '',
              '| Tool | Category | One-line install | Binary | Source |',
              '|---|---|---|---|---|',
          ]
          for entry in added:
              section.append(
                  f"| {esc(entry['name'])} | `{esc(entry['category'])}` | `{esc(entry['installer'])}` | "
                  f"`{esc(entry['binary'])}` | {esc(entry['url'])} |"
              )
          section += [
              '',
              '**Removed stale entry:** `Agent Orchestrator (ao)` / `@aoagents/ao` because upstream freezes the npm CLI at 0.10.0 and explicitly recommends the desktop distribution for new setups.',
              '',
              'The machine-readable `catalog.json` remains the canonical source of truth.',
              '',
          ]
          readme_path.write_text(readme.rstrip() + '\n\n' + '\n'.join(section), encoding='utf-8')
          PY

      - name: Validate catalog
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_catalog.py
          for slug in huggingface-tau untether ast-outline; do
            python scripts/catalog.py show "$slug" >/dev/null
          done
          if python scripts/catalog.py show ao-agents >/dev/null 2>&1; then
            echo 'Legacy ao-agents entry still exists' >&2
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('catalog.json').read_text(encoding='utf-8'))
          slugs = [entry['slug'] for entry in data['entries']]
          assert len(slugs) == len(set(slugs))
          assert len(data['entries']) == 427
          assert data['last_reviewed'] == '2026-08-13'
          print('Validated 427 unique catalog entries')
          PY

      - name: Commit generated catalog changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf bootstrap/continuation8
          rm -f .github/workflows/apply-continuation8.yml
          git add catalog.json README.md bootstrap/continuation8 .github/workflows/apply-continuation8.yml
          git commit -m "Refresh August 13 verified AI CLI entries"
          git push
