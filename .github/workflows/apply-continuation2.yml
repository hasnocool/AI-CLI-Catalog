# .github/workflows/apply-continuation2.yml
name: Apply second continued catalog expansion

on:
  push:
    paths:
      - "bootstrap/continuation2/**"
      - ".github/workflows/apply-continuation2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decode verified candidates
        shell: bash
        run: |
          set -euo pipefail
          base64 -d bootstrap/continuation2/additions.json.gz.b64 | gzip -d > /tmp/additions.json
          python - <<'PY'
          import json
          data = json.load(open('/tmp/additions.json'))
          assert isinstance(data, list) and len(data) == 36, len(data)
          assert len({x['slug'] for x in data}) == len(data)
          print(f"Decoded {len(data)} verified candidates")
          PY

      - name: Merge and deduplicate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re
          from collections import Counter
          from pathlib import Path

          cp = Path('catalog.json')
          rp = Path('README.md')
          catalog = json.loads(cp.read_text())
          candidates = json.loads(Path('/tmp/additions.json').read_text())
          slugs = {e['slug'] for e in catalog['entries']}
          urls = {e['url'].rstrip('/').lower() for e in catalog['entries']}
          added = []
          for e in candidates:
              u = e['url'].rstrip('/').lower()
              if e['slug'] in slugs or u in urls:
                  continue
              catalog['entries'].append(e)
              slugs.add(e['slug'])
              urls.add(u)
              added.append(e)

          if len(added) < 15:
              raise SystemExit(f'Only {len(added)} unique candidates survived de-duplication')

          catalog['last_reviewed'] = '2026-08-09'
          catalog['entries'].sort(key=lambda e: (e['category'].lower(), e['name'].lower(), e['slug']))
          cp.write_text(json.dumps(catalog, indent=2, ensure_ascii=False) + '\n')

          total = len(catalog['entries'])
          counts = Counter(e['category'] for e in catalog['entries'])
          readme = rp.read_text()
          readme = re.sub(r'> Catalog entries: \*\*\d+\*\*', f'> Catalog entries: **{total}**', readme, count=1)
          table = ['| Category | Entries |', '|---|---:|']
          table += [f'| `{k}` | {v} |' for k, v in sorted(counts.items(), key=lambda kv: (-kv[1], kv[0]))]
          block = '## Categories\n\n' + '\n'.join(table) + '\n'
          readme = re.sub(r'## Categories\n.*?(?=\n## )', block, readme, count=1, flags=re.S)

          marker = '## Second continued expansion — August 2026'
          if marker in readme:
              readme = readme.split(marker, 1)[0].rstrip() + '\n\n'
          def esc(x): return str(x).replace('|', '\\|').replace('`', '\\`')
          sec = [
              marker, '',
              f'This pass added **{len(added)}** more de-duplicated entries, bringing the catalog to **{total} tools**. Each added record has a current upstream one-line installer or package-manager command; uncertain capability flags remain `null`.',
              '', '| Tool | Category | One-line install | Binary | Source |', '|---|---|---|---|---|'
          ]
          for e in added:
              sec.append(f"| {esc(e['name'])} | `{esc(e['category'])}` | `{esc(e['installer'])}` | `{esc(e['binary'])}` | {esc(e['url'])} |")
          sec += ['', 'The machine-readable `catalog.json` remains the canonical source of truth.', '']
          rp.write_text(readme.rstrip() + '\n\n' + '\n'.join(sec))
          Path('/tmp/added-count').write_text(str(len(added)))
          Path('/tmp/total-count').write_text(str(total))
          print(f'Added {len(added)}; total={total}')
          PY
          rm -rf bootstrap/continuation2

      - name: Validate expanded catalog
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_catalog.py
          for slug in microsoft-conductor microsoft-apm google-agents-cli apify-mcpc projectmem mcporter; do
            python scripts/catalog.py show "$slug" >/dev/null
          done
          python - <<'PY'
          import json
          data=json.load(open('catalog.json'))
          slugs=[e['slug'] for e in data['entries']]
          assert len(slugs)==len(set(slugs))
          assert len(data['entries']) >= 353, len(data['entries'])
          print(f"Validated {len(data['entries'])} entries")
          PY

      - name: Commit second continuation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          COUNT="$(cat /tmp/added-count)"
          git add catalog.json README.md bootstrap/continuation2
          git commit -m "Add ${COUNT} additional verified AI CLI entries" || exit 0
          git push
