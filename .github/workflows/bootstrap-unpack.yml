# .github/workflows/bootstrap-unpack.yml
name: Bootstrap repository contents

on:
  push:
    paths:
      - "bootstrap/archive/**"
      - ".github/workflows/bootstrap-unpack.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct repository archive
        run: |
          set -euo pipefail
          cat bootstrap/archive/part*.b64 | tr -d '\n' | base64 -d > /tmp/ai-cli-catalog.tar.gz
          mkdir -p /tmp/ai-cli-catalog
          tar -xzf /tmp/ai-cli-catalog.tar.gz -C /tmp/ai-cli-catalog

      - name: Replace bootstrap tree with catalog tree
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git' /tmp/ai-cli-catalog/AI-CLI-Catalog/ ./
          rm -rf bootstrap /tmp/ai-cli-catalog /tmp/ai-cli-catalog.tar.gz
          rm -f .github/workflows/bootstrap-unpack.yml

      - name: Commit expanded catalog
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Expand AI CLI catalog and add schema v2" || exit 0
          git push
