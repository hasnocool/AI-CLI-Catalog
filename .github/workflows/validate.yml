# .github/workflows/validate.yml
name: Validate catalog

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate catalog invariants
        run: python scripts/validate_catalog.py
      - name: Smoke-test catalog CLI
        run: |
          python scripts/catalog.py list --mcp true >/dev/null
          python scripts/catalog.py show opencode >/dev/null
          python scripts/catalog.py install opencode >/dev/null
